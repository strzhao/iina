# SwiftLint 配置 — IINA
# 适度规则：启用核心质量规则，放宽会与现有代码大规模冲突的规则，避免 warning 洪水。
# 运行：swiftlint lint --path iina/

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool
  - contains_over_first_not_nil
  - redundant_nil_coalescing

# 放宽对现有代码过严的规则（IINA 历史代码库大，逐步收紧）
disabled_rules:
  - trailing_whitespace
  - nesting
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - large_tuple
  - force_unwrapping

# 路径排除（依赖 / 生成 / 第三方）
excluded:
  - deps
  - build
  - DerivedData
  - iina/other
  - other
  - browser
  - OpenInIINA
  - iina-plugin
  - iina-cli
  - tests

# 行长度放宽（IINA 现有代码多长行）
line_length:
  warning: 200
  error: 320

# 标识符长度
identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

# 类型名沿用现有
type_name:
  max_length: 60
